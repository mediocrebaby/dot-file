[input]

prepend_keymap = [
  { on = "<ESC>",  run = "close", desc = "Cancel input"}
]

[mgr]

prepend_keymap = [
  { on = "<Enter>",    run = "plugin smart-enter",   desc = "Enter dir or open file" },
  { on = "-",          run = "leave",                desc = "Go to parent directory" },
  { on = [ "g", "w" ], run = "cd ~/Code/workspace", desc = "Go to ~/Code/workspace" },
  { on = [ "g", "r" ], run = "cd ~/Code",           desc = "Go to ~/Code" },
]
